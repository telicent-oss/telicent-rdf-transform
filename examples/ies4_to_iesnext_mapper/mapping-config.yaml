---
# Example configuration using RDF mapping file for ontology transformations
# This approach is cleaner when you have many property/class mappings

# Namespace definitions
# PRIMARY PURPOSE: Control prefix bindings in OUTPUT graph serialization
# These namespaces determine how URIs are abbreviated in the output RDF/Turtle.
#   With prefixes:  ies_core:Country
#   Without:        <http://purl.org/ies/core/v0/ont#Country>
#
# SECONDARY PURPOSE: Auto-prefix SPARQL queries (if they don't already have PREFIX declarations)
# If your queries already include PREFIX declarations (like below), these namespaces
# are NOT required for the queries to work - they only affect output formatting.
namespaces:
  ies: "http://ies.data.gov.uk/ontology/ies4#"
  ies_core: "http://purl.org/ies/core/v0/ont/"
  ies_top: "http://purl.org/ies/top/v0/ont/"
  rdf: "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  owl: "http://www.w3.org/2002/07/owl#"
  ical: "http://www.w3.org/2002/12/cal/ical#"

# Optional: RDF mapping file configuration
# Path to RDF file with owl:equivalentProperty/Class mappings
mapping_file: resource-mapping.ttl
mapping_file_format: text/turtle  # Optional, defaults to text/turtle

# SPARQL UPDATE queries that use the mapping file
# All queries use DELETE/INSERT WHERE to modify the working graph in place
queries:
  # Query description: Combined mapping - transform both properties and classes
  # Deletes original IES4 triples and inserts mapped IES Next triples
  - name: "map_properties_and_classes"
    description: "Transform properties, classes, and individuals using owl:equivalentProperty/Class and owl:sameAs mappings"
    enabled: true
    order: 100
    query: |

      # Map properties: delete IES4 property triple, insert IES Next property triple
      DELETE {
        ?subject ?sourceProp ?object .
      }
      INSERT {
        ?targetSubject ?targetProp ?targetObject .
      }
      WHERE {
        ?subject ?sourceProp ?object .
        ?sourceProp owl:equivalentProperty ?targetProp .
        # Optionally map subject individual via owl:sameAs
        OPTIONAL { ?subject owl:sameAs ?mappedSubject }
        BIND(COALESCE(?mappedSubject, ?subject) AS ?targetSubject)
        # Optionally map object individual via owl:sameAs
        OPTIONAL { ?object owl:sameAs ?mappedObject }
        BIND(COALESCE(?mappedObject, ?object) AS ?targetObject)
      };

      # Map classes: delete IES4 class triple, insert IES Next class triple
      DELETE {
        ?subject a ?sourceClass .
      }
      INSERT {
        ?targetSubject a ?targetClass .
      }
      WHERE {
        ?subject a ?sourceClass .
        ?sourceClass owl:equivalentClass ?targetClass .
        # Optionally map subject individual via owl:sameAs
        OPTIONAL { ?subject owl:sameAs ?mappedSubject }
        BIND(COALESCE(?mappedSubject, ?subject) AS ?targetSubject)
      }

  - name: "crossing_mapping"
    description: "Complex mapping for ies:Crossing"
    enabled: true
    order: 1
    query: |
      # Delete IES4 crossing pattern, insert IES Next pattern
      DELETE {
        ?crossing a ies:Crossing .
        ?crossing ies:crossingOf ?crossed_locations .
      }
      INSERT {
        ?crossing a ies_top:SpatiotemporalExtent .
        ?crossing ies_top:intersectionOf ?set_of_overlapping_extents .
        ?crossed_locations a ?set_of_overlapping_extents .
        ?set_of_overlapping_extents a ies_top:SetOfOverlappingSpatiotemporalExtents .
      }
      WHERE {
        ?crossing a ies:Crossing .
        ?crossing ies:crossingOf ?crossed_locations .

        BIND(
          IRI(CONCAT(STR(?crossing), "_set_of_overlapping_extents"))
          AS ?set_of_overlapping_extents
        )
      }

  - name: "duration_mapping"
    description: "Complex mapping for ies:Duration"
    enabled: true
    order: 2
    query: |
      # Delete IES4 duration pattern, insert IES Next pattern with ISO8601 duration
      DELETE {
        ?element ies:hasCharacteristic ?element_duration .
        ?element_duration a ies:Duration .
        ?element_duration ies:hasValue ?duration_value .
        ?duration_value a ies:ValueInSeconds .
        ?duration_value ies:representationValue ?seconds_literal .
      }
      INSERT {
        ?element ies_core:duration ?element_duration .
        ?element_duration a ies_core:SetOfStatesWithParticularDuration .
        ?element_duration ies_core:iso8601DurationRepresentation ?duration_literal .
      }
      WHERE {
        ?element ies:hasCharacteristic ?element_duration .
        ?element_duration a ies:Duration .
        ?element_duration ies:hasValue ?duration_value .
        ?duration_value a ies:ValueInSeconds .
        ?duration_value ies:representationValue ?seconds_literal .

        # Accept "3601"^^xsd:string, "3601", 3601, 3601.0, etc.
        BIND(xsd:integer(?seconds_literal) AS ?sec0)

        # Guard against negatives
        BIND(IF(?sec0 < 0, -?sec0, ?sec0) AS ?sec)

        BIND(FLOOR(?sec / 86400) AS ?days)
        BIND(?sec - (?days * 86400) AS ?rem1)

        BIND(FLOOR(?rem1 / 3600) AS ?hours)
        BIND(?rem1 - (?hours * 3600) AS ?rem2)

        BIND(FLOOR(?rem2 / 60) AS ?mins)
        BIND(?rem2 - (?mins * 60) AS ?secs)

        # Build ISO8601 duration lexical form
        BIND(CONCAT(
              "P", STR(?days), "DT",
              STR(?hours), "H",
              STR(?mins),  "M",
              STR(?secs),  "S"
            ) AS ?durLex)

        # Cast to xsd:duration using STRDT
        BIND(STRDT(?durLex, xsd:duration) AS ?duration_literal)
      }

  - name: "recurring_period_mapping"
    description: "Complex mapping for ies:RecurringPeriod"
    enabled: true
    order: 3
    query: |
      DELETE {
        ?recurring_period a ies:RecurringPeriod .
        ?recurring_period ies:recurrentPeriodRepresentation ?recurrent_literal .
        ?recurring_period ies:startsIn ?start_period .
        ?recurring_period ies:endsIn ?end_period .
      }
      INSERT {
        ?recurring_period a ies_core:RecurringTimespan .
        ?recurring_period ies_core:hasICalRepresentation ?ical_representation .
        ?ical_representation a ies_core:ICalRepresentation .
        ?ical_representation ical:rrule ?rrule .
        ?ical_representation ical:dtstart ?start_literal .
        ?ical_representation ical:dtend ?end_literal .
        ?start_period ies_top:isAStartOf ?recurring_period .
        ?end_period ies_top:isAFinishOf ?recurring_period .
      }
      WHERE {
        ?recurring_period a ies:RecurringPeriod .
        ?recurring_period ies:recurrentPeriodRepresentation ?recurrent_literal .

        OPTIONAL {
          ?recurring_period ies:startsIn ?start_period .
          ?start_period ies:iso8601PeriodRepresentation ?start_literal .
          BIND(REPLACE(STR(?start_literal), "[-:]", "") AS ?dstart_val)
        }

        OPTIONAL {
          ?recurring_period ies:endsIn ?end_period .
          ?end_period ies:iso8601PeriodRepresentation ?end_literal .
          BIND(REPLACE(STR(?end_literal), "[-:]", "") AS ?until_val)
        }

        # Pattern detection
        # Daily: ????-??-??T{HH}:... where hour is a known digit (not ??)
        BIND(REGEX(STR(?recurrent_literal), "^\\?\\?\\?\\?-\\?\\?-\\?\\?T\\d{2}") AS ?is_daily)
        # Yearly: ????-{MM}-{DD}
        BIND(REGEX(STR(?recurrent_literal), "^\\?\\?\\?\\?-(\\d{2})-(\\d{2})$") AS ?is_yearly)
        # Monthly: ????-??-{DD}
        BIND(REGEX(STR(?recurrent_literal), "^\\?\\?\\?\\?-\\?\\?-(\\d{2})$") AS ?is_monthly)
        # Hourly: ????-??-??T??:{MM}:00 where minute is known and second is 00
        BIND(REGEX(STR(?recurrent_literal), "^\\?\\?\\?\\?-\\?\\?-\\?\\?T\\?\\?:\\d{2}:00$") AS ?is_hourly)
        # Minutely: ????-??-??T??:{MM} where hour is ?? but minute is known (no seconds)
        BIND(REGEX(STR(?recurrent_literal), "^\\?\\?\\?\\?-\\?\\?-\\?\\?T\\?\\?:\\d{2}$") AS ?is_minutely)
        # Minutely by second: ????-??-??T??:??:{SS} where hour and minute are ?? but second is known digit
        BIND(REGEX(STR(?recurrent_literal), "^\\?\\?\\?\\?-\\?\\?-\\?\\?T\\?\\?:\\?\\?:\\d{2}$") AS ?is_minutely_bysecond)
        # Millisecondly: ????-??-??T??:??:{SS}.{ms} where seconds are digits followed by decimal
        BIND(REGEX(STR(?recurrent_literal), "^\\?\\?\\?\\?-\\?\\?-\\?\\?T\\?\\?:\\?\\?:\\d{2}\\.\\d+") AS ?is_millisecondly)
        # Secondly: ????-??-??T??:??:{SS} - fallback
        BIND(REGEX(STR(?recurrent_literal), "^\\?\\?\\?\\?-\\?\\?-\\?\\?T\\?\\?:\\?\\?:\\d{2}") AS ?is_secondly)

        # Daily: extract hour, minute, second
        BIND(IF(?is_daily,
          xsd:integer(REPLACE(STR(?recurrent_literal), "^.*T(\\d{2}).*$", "$1")),
          0) AS ?hour_int)
        BIND(IF(?is_daily && REGEX(STR(?recurrent_literal), "T\\d{2}:\\d{2}"),
          xsd:integer(REPLACE(STR(?recurrent_literal), "^.*T\\d{2}:(\\d{2}).*$", "$1")),
          0) AS ?minute_int)
        BIND(IF(?is_daily && REGEX(STR(?recurrent_literal), "T\\d{2}:\\d{2}:\\d{2}"),
          xsd:integer(REPLACE(STR(?recurrent_literal), "^.*T\\d{2}:\\d{2}:(\\d{2})(\\..+)?$", "$1")),
          0) AS ?second_int)

        # Daily optional parts
        BIND(IF(?is_daily && ?minute_int > 0, CONCAT(";BYMINUTE=", STR(?minute_int)), "") AS ?minute_part)
        BIND(IF(?is_daily && ?second_int > 0, CONCAT(";BYSECOND=", STR(?second_int)), "") AS ?second_part)

        # Hourly: extract minute
        BIND(IF(?is_hourly,
          xsd:integer(REPLACE(STR(?recurrent_literal), "^.*T\\?\\?:(\\d{2}):00$", "$1")),
          0) AS ?hourly_minute)

        # Minutely: extract minute interval
        BIND(IF(?is_minutely,
          xsd:integer(REPLACE(STR(?recurrent_literal), "^.*T\\?\\?:(\\d{2})$", "$1")),
          0) AS ?minute_interval)

        # Minutely by second: extract second
        BIND(IF(?is_minutely_bysecond,
          xsd:integer(REPLACE(STR(?recurrent_literal), "^.*T\\?\\?:\\?\\?:(\\d{2})$", "$1")),
          0) AS ?minutely_second)

        # Secondly: extract second interval (only if not millisecondly or minutely_bysecond)
        BIND(IF(?is_secondly && !?is_minutely_bysecond && !?is_millisecondly,
          xsd:integer(REPLACE(STR(?recurrent_literal), "^.*T\\?\\?:\\?\\?:(\\d{2}).*$", "$1")),
          0) AS ?second_interval)

        # Yearly: extract month and day
        BIND(IF(?is_yearly,
          STR(xsd:integer(REPLACE(STR(?recurrent_literal), "^\\?\\?\\?\\?-(\\d{2})-(\\d{2})$", "$1"))),
          "") AS ?month)
        BIND(IF(?is_yearly,
          STR(xsd:integer(REPLACE(STR(?recurrent_literal), "^\\?\\?\\?\\?-(\\d{2})-(\\d{2})$", "$2"))),
          "") AS ?day)

        # Monthly: extract day
        BIND(IF(?is_monthly,
          STR(xsd:integer(REPLACE(STR(?recurrent_literal), "^\\?\\?\\?\\?-\\?\\?-(\\d{2})$", "$1"))),
          "") AS ?month_day)

        # DSTART prefix and UNTIL suffix
        BIND(IF(BOUND(?dstart_val), CONCAT("DSTART:", ?dstart_val, ";"), "") AS ?dstart_prefix)
        BIND(IF(BOUND(?until_val), CONCAT(";UNTIL=", ?until_val), "") AS ?until_suffix)

        # Assemble RRULE
        BIND(
          IF(?is_daily,
            CONCAT(?dstart_prefix, "FREQ=DAILY;BYHOUR=", STR(?hour_int), ?minute_part, ?second_part, ?until_suffix),
          IF(?is_hourly,
            CONCAT(?dstart_prefix, "FREQ=HOURLY;BYMINUTE=", STR(?hourly_minute), ?until_suffix),
          IF(?is_minutely,
            CONCAT(?dstart_prefix, "FREQ=MINUTELY;INTERVAL=", STR(?minute_interval), ?until_suffix),
          IF(?is_minutely_bysecond,
            CONCAT(?dstart_prefix, "FREQ=MINUTELY;BYSECOND=", STR(?minutely_second), ?until_suffix),
          IF(?is_millisecondly,
            CONCAT(?dstart_prefix, "FREQ=SECONDLY;INTERVAL=1", ?until_suffix),
          IF(?is_secondly,
            CONCAT(?dstart_prefix, "FREQ=SECONDLY;INTERVAL=", STR(?second_interval), ?until_suffix),
          IF(?is_yearly,
            CONCAT(?dstart_prefix, "FREQ=YEARLY;BYMONTH=", ?month, ";BYMONTHDAY=", ?day, ?until_suffix),
          IF(?is_monthly,
            CONCAT(?dstart_prefix, "FREQ=MONTHLY;BYMONTHDAY=", ?month_day, ?until_suffix),
            STR(?recurrent_literal)
          ))))))))
          AS ?rrule_str
        )
        BIND(STRDT(?rrule_str, xsd:string) AS ?rrule)
        BIND(IRI(CONCAT(STR(?recurring_period), "_representation")) AS ?ical_representation)
      }
      
  - name: "make_to_create_pattern_mapping"
    description: "Replace ies:make property with ies_core:Create pattern"
    enabled: true
    order: 4
    query: |
      DELETE {
        ?asset ies:make ?org .
      }
      INSERT {
        # Create
        ?create_event rdf:type ies_core:Create .

        # Creator 
        ?creator rdf:type ies_core:Creator .
        ?creator ies_top:isPartOf ?create_event .
        ?creator ies_top:isTemporalPartOf  ?org .

        # Created 
        ?created rdf:type ies_core:Created .
        ?created ies_top:isAStartOf ?asset .
        ?created ies_top:isPartOf         ?create_event .
      }
      WHERE {
        ?asset ies:make ?org .

        # Generate deterministic URIs for new nodes
        BIND(IRI(CONCAT(STR(?asset), "_create_event")) AS ?create_event)
        BIND(IRI(CONCAT(STR(?asset), "_creator"))      AS ?creator)
        BIND(IRI(CONCAT(STR(?asset), "_created"))      AS ?created)
      }
 